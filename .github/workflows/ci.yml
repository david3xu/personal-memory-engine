name: Implementation checks
on:
  pull_request:
    branches: [main, 'stage/**']
  push:
    branches: [main, 'stage/**']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build
      - name: Verify bundled MCP helper
        run: pnpm test:package
        env:
          MCP_HELPER: target/release/bundle/macos/Personal Memory Engine.app/Contents/MacOS/memory-mcp
      - name: Archive unsigned development app
        run: ditto -c -k --sequesterRsrc --keepParent "target/release/bundle/macos/Personal Memory Engine.app" "Personal-Memory-Engine-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-development-app
          path: Personal-Memory-Engine-macos.zip
          retention-days: 14
