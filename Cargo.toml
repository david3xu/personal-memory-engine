[workspace]
members = ["crates/engine", "crates/local-runtime", "crates/public-snapshot", "crates/github-publication", "web/owner/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
